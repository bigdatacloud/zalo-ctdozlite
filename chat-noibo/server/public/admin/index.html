<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quản trị Chat Nội Bộ</title>
<style>
:root{
  --bg:#f1f5f9;--panel:#fff;--text:#0f172a;--muted:#64748b;--border:#e2e8f0;--primary:#0068ff;--primary-ink:#fff;
  --danger:#dc2626;--warn:#b45309;--ok:#16a34a;--hover:#f8fafc;--chip:#eef2ff;--ext:#9333ea;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#1d1f23;--panel:#282c34;--text:#d7dae0;--muted:#8e96a5;--border:#3e4451;--primary:#528bff;--primary-ink:#fff;
  --danger:#e06c75;--warn:#e5c07b;--ok:#98c379;--hover:#323842;--chip:#2c313a;--ext:#c678dd;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1d1f23;--panel:#282c34;--text:#d7dae0;--muted:#8e96a5;--border:#3e4451;--primary:#528bff;
  --danger:#e06c75;--warn:#e5c07b;--ok:#98c379;--hover:#323842;--chip:#2c313a;--ext:#c678dd;color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
input,select,textarea{background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:8px 10px;width:100%}
input:focus,select:focus,textarea:focus{outline:2px solid var(--primary);outline-offset:-1px}
button{border:1px solid var(--border);background:var(--panel);border-radius:8px;padding:7px 12px;cursor:pointer}
button:hover{background:var(--hover)}
button.primary{background:var(--primary);border-color:var(--primary);color:var(--primary-ink)}
button.danger{color:var(--danger)}
button.small{padding:3px 8px;font-size:12px}
a.btn{border:1px solid var(--border);border-radius:8px;padding:7px 12px;color:inherit;text-decoration:none}
header{display:flex;align-items:center;gap:12px;padding:12px 16px;background:var(--panel);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:2}
header h1{font-size:16px;margin:0;flex:1}
nav{display:flex;gap:4px;padding:8px 16px;background:var(--panel);border-bottom:1px solid var(--border);overflow-x:auto}
nav button{border:none;background:none;border-radius:6px;white-space:nowrap}
nav button.on{background:var(--chip);color:var(--primary);font-weight:600}
main{padding:16px;max-width:1280px;margin:0 auto}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.bar input,.bar select{width:auto;min-width:160px;flex:0 1 240px}
.bar .grow{flex:1}
.card{background:var(--panel);border:1px solid var(--border);border-radius:10px;overflow:auto}
table{border-collapse:collapse;width:100%}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--border);vertical-align:top}
th{font-size:12px;color:var(--muted);font-weight:600;background:var(--panel);position:sticky;top:0}
tr:hover td{background:var(--hover)}
.muted{color:var(--muted)}.small{font-size:12px}
.chip{display:inline-block;padding:1px 7px;border-radius:6px;font-size:12px;font-weight:600;background:var(--chip)}
.chip.ext{color:var(--ext)}.chip.ok{color:var(--ok)}.chip.bad{color:var(--danger)}.chip.warn{color:var(--warn)}.chip.pri{color:var(--primary)}
.login{max-width:360px;margin:12vh auto;background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:24px;display:grid;gap:12px}
dialog{border:1px solid var(--border);border-radius:12px;background:var(--panel);color:var(--text);padding:0;width:min(560px,calc(100vw - 32px))}
dialog::backdrop{background:rgba(0,0,0,.35)}
dialog form{display:grid;gap:10px;padding:20px}
dialog h2{margin:0 0 4px;font-size:17px}
dialog .actions{display:flex;justify-content:flex-end;gap:8px;margin-top:6px}
label{display:grid;gap:4px;font-size:12px;color:var(--muted)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:600px){.row2{grid-template-columns:1fr}}
.picker{max-height:240px;overflow:auto;border:1px solid var(--border);border-radius:8px}
.picker label{display:flex;gap:8px;align-items:center;padding:6px 10px;color:var(--text);font-size:14px;border-bottom:1px solid var(--border)}
.picker input{width:auto}
.toggle{display:inline-flex;gap:4px;align-items:center;font-size:12px;color:var(--text);margin-right:8px;white-space:nowrap}
.toggle input{width:auto}
.secret{font-family:ui-monospace,Consolas,monospace;background:var(--chip);padding:10px;border-radius:8px;user-select:all;word-break:break-all}
#toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--text);color:var(--panel);padding:10px 16px;border-radius:8px;display:none;max-width:calc(100vw - 32px);z-index:10}
.err{color:var(--danger)}
.empty{padding:28px;text-align:center;color:var(--muted)}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast"></div>
<dialog id="dlg"><form method="dialog" id="dlgForm"></form></dialog>
<script>
"use strict";
const API = location.origin;
let TOKEN = null;
try { TOKEN = sessionStorage.getItem("adm_token"); } catch {}
let ME = null;
const state = { tab: "approvals", approvals: [], apStatus: "pending", users: [], groups: [], devices: [], settings: {}, audit: [], userKind: "all", q: "" };

const $ = (s, el = document) => el.querySelector(s);
const esc = (v) => String(v ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
function toast(msg, err) {
  const t = $("#toast"); t.textContent = msg; t.style.background = err ? "var(--danger)" : ""; t.style.display = "block";
  clearTimeout(toast.h); toast.h = setTimeout(() => (t.style.display = "none"), 3500);
}
async function api(path, opt = {}) {
  const r = await fetch(API + path, {
    method: opt.method || "GET",
    headers: { "content-type": "application/json", ...(TOKEN ? { authorization: "Bearer " + TOKEN } : {}) },
    body: opt.body ? JSON.stringify(opt.body) : undefined,
  });
  const d = await r.json().catch(() => ({}));
  if (r.status === 401) { logout(d.message); throw new Error(d.message || "Hết phiên"); }
  if (!r.ok) throw new Error(d.message || "Lỗi " + r.status);
  return d;
}
const fmtDate = (ms) => (ms ? new Date(ms).toLocaleString("vi-VN", { dateStyle: "short", timeStyle: "short" }) : "");
const fmtDay = (ms) => (ms ? new Date(ms).toLocaleDateString("vi-VN") : "");
function genPassword() {
  const a = "abcdefghjkmnpqrstuvwxyzABCDEFGHJKLMNPQRSTUVWXYZ23456789"; const b = new Uint32Array(12);
  crypto.getRandomValues(b); return [...b].map((x) => a[x % a.length]).join("");
}
function logout(msg) {
  TOKEN = null; ME = null; try { sessionStorage.removeItem("adm_token"); } catch {}
  renderLogin(msg);
}

// ------------------------------------------------------------------ Đăng nhập
function renderLogin(msg) {
  $("#app").innerHTML = `
  <form class="login" id="lf">
    <h2 style="margin:0">Quản trị Chat Nội Bộ</h2>
    <div class="muted small">Chỉ tài khoản quản trị viên đăng nhập được.</div>
    ${msg ? `<div class="err">${esc(msg)}</div>` : ""}
    <label>Mã nhân viên<input name="u" autocomplete="username" required></label>
    <label>Mật khẩu<input name="p" type="password" autocomplete="current-password" required></label>
    <button class="primary">Đăng nhập</button>
  </form>`;
  $("#lf").onsubmit = async (e) => {
    e.preventDefault();
    const f = new FormData(e.target);
    try {
      const r = await fetch(API + "/api/auth/login", { method: "POST", headers: { "content-type": "application/json" },
        body: JSON.stringify({ username: f.get("u"), password: f.get("p"), platform: "web", device_name: "Trang quản trị" }) });
      const d = await r.json();
      if (!r.ok) return renderLogin(d.message);
      if (d.me.role !== "admin") { TOKEN = d.token; await api("/api/auth/logout", { method: "POST" }).catch(() => {}); return renderLogin("Tài khoản này không có quyền quản trị"); }
      TOKEN = d.token; ME = d.me; try { sessionStorage.setItem("adm_token", TOKEN); } catch {}
      shell();
    } catch { renderLogin("Không kết nối được máy chủ"); }
  };
}

// ------------------------------------------------------------------ Khung chính
const TABS = [["approvals", "Duyệt tệp"], ["users", "Tài khoản"], ["groups", "Nhóm"], ["devices", "Thiết bị"], ["settings", "Chính sách"], ["audit", "Nhật ký"]];
function shell() {
  $("#app").innerHTML = `
  <header><h1>Quản trị Chat Nội Bộ</h1><span class="muted small">${esc(ME.display_name)}</span>
    <button class="small" id="lo">Đăng xuất</button></header>
  <nav id="tabs">${TABS.map(([k, v]) => `<button data-t="${k}">${v}${k === "approvals" ? ` <span class="chip warn" id="apc" hidden></span>` : ""}</button>`).join("")}</nav>
  <main id="main"></main>`;
  $("#lo").onclick = async () => { await api("/api/auth/logout", { method: "POST" }).catch(() => {}); logout(); };
  $("#tabs").onclick = (e) => { const t = e.target.closest("button")?.dataset.t; if (t) { state.tab = t; render(); } };
  render(); refreshApprovalCount(); setInterval(refreshApprovalCount, 30000);
}
async function render() {
  document.querySelectorAll("#tabs button").forEach((b) => b.classList.toggle("on", b.dataset.t === state.tab));
  const m = $("#main"); m.innerHTML = `<div class="empty">Đang tải…</div>`;
  try { await ({ approvals: renderApprovals, users: renderUsers, groups: renderGroups, devices: renderDevices, settings: renderSettings, audit: renderAudit })[state.tab](m); }
  catch (e) { m.innerHTML = `<div class="empty err">${esc(e.message)}</div>`; }
}

// ------------------------------------------------------------------ Duyệt tệp
const AP_ST = { pending: ["warn", "Chờ duyệt"], approved: ["ok", "Đã duyệt"], rejected: ["bad", "Từ chối"], cancelled: ["", "Đã rút"] };
async function refreshApprovalCount() {
  try {
    const n = (await api("/api/approvals?status=pending")).approvals.length;
    const el = $("#apc"); if (el) { el.hidden = !n; el.textContent = n; }
  } catch {}
}
async function fetchApprovalFile(a) {
  const r = await fetch(`${API}/api/approvals/${a.id}/file`, { headers: { authorization: "Bearer " + TOKEN } });
  if (!r.ok) throw new Error((await r.json().catch(() => ({}))).message || "Không mở được tệp");
  return r.blob();
}
async function previewApproval(a) {
  const blob = await fetchApprovalFile(a);
  const url = URL.createObjectURL(blob);
  let body;
  if (a.file.mime.startsWith("image/")) body = `<img src="${url}" style="max-width:100%;max-height:60vh;display:block;margin:auto">`;
  else if (a.file.mime.startsWith("text/") || a.file.mime === "application/json") body = `<pre style="max-height:60vh;overflow:auto;white-space:pre-wrap;margin:0">${esc(await blob.text())}</pre>`;
  else if (a.file.mime === "application/pdf") body = `<iframe src="${url}" style="width:100%;height:60vh;border:0"></iframe>`;
  else body = `<div class="muted">Không xem trước được loại tệp này trong trình duyệt. Tải về để kiểm tra.</div>`;
  openDialog(`<h2>${esc(a.file.name)}</h2>
    <div class="muted small">${esc(a.sender_name)} → ${esc(a.organization)} · ${fmtSize(a.file.size)} · SHA-256 ${esc(a.file.sha256.slice(0, 16))}…</div>
    ${a.caption ? `<div>${esc(a.caption)}</div>` : ""}${body}
    <div class="actions"><a class="btn" href="${url}" download="${esc(a.file.name)}">Tải về</a><button class="primary">Đóng</button></div>`, () => {});
  $("#dlg").addEventListener("close", () => URL.revokeObjectURL(url), { once: true });
}
function fmtSize(b) { return b < 1024 ? b + " B" : b < 1048576 ? Math.round(b / 1024) + " KB" : (b / 1048576).toFixed(1) + " MB"; }
async function renderApprovals(m) {
  state.approvals = (await api(`/api/approvals?status=${state.apStatus}&limit=200`)).approvals;
  m.innerHTML = `<div class="bar">
    <select id="aps"><option value="pending">Đang chờ duyệt</option><option value="all">Tất cả (lịch sử)</option></select>
    <span class="grow"></span><button id="apr">Làm mới</button></div>
    <div class="card"><table><thead><tr><th>Gửi lúc</th><th>Người gửi</th><th>Gửi tới</th><th>Tệp</th><th>Trạng thái</th><th></th></tr></thead><tbody id="apt"></tbody></table></div>
    <p class="muted small">Tệp nhân viên gửi vào nhóm có người bên ngoài nằm ở đây cho tới khi được duyệt. Đối tác không thấy tệp chờ duyệt hay bị từ chối. Trưởng bộ phận được giao quyền duyệt cũng xử lý được ngay trong ứng dụng.</p>`;
  $("#aps").value = state.apStatus;
  $("#aps").onchange = (e) => { state.apStatus = e.target.value; render(); };
  $("#apr").onclick = () => render();
  $("#apt").innerHTML = state.approvals.length ? state.approvals.map((a) => `<tr>
    <td class="small" style="white-space:nowrap">${fmtDate(a.created_at)}</td>
    <td>${esc(a.sender_name)} <span class="muted small">${esc(a.sender_username)}</span></td>
    <td><span class="chip ext">${esc(a.organization)}</span><div class="muted small">${esc(a.conversation_name)}</div></td>
    <td><a href="#" data-pv="${a.id}">${esc(a.file.name)}</a><div class="muted small">${fmtSize(a.file.size)}${a.caption ? " · " + esc(a.caption) : ""}</div></td>
    <td><span class="chip ${AP_ST[a.status][0]}">${AP_ST[a.status][1]}</span>
      ${a.decided_by_name ? `<div class="muted small">${esc(a.decided_by_name)} · ${fmtDate(a.decided_at)}</div>` : ""}
      ${a.reason ? `<div class="small">${esc(a.reason)}</div>` : ""}</td>
    <td style="white-space:nowrap">${a.status === "pending" ? `<button class="small" data-pv="${a.id}">Xem</button>
      <button class="small danger" data-rj="${a.id}">Từ chối</button> <button class="small primary" data-ok="${a.id}">Duyệt</button>` : ""}</td>
  </tr>`).join("") : `<tr><td colspan="6" class="empty">${state.apStatus === "pending" ? "Không có tệp nào chờ duyệt" : "Chưa có dữ liệu"}</td></tr>`;
  $("#apt").onclick = async (e) => {
    const t = e.target, find = (id) => state.approvals.find((a) => a.id === id);
    try {
      if (t.dataset.pv) { e.preventDefault(); await previewApproval(find(t.dataset.pv)); }
      if (t.dataset.ok) {
        const a = find(t.dataset.ok);
        if (!confirm(`Duyệt gửi "${a.file.name}" tới ${a.organization}?`)) return;
        await api(`/api/approvals/${a.id}/approve`, { method: "POST" }); toast("Đã duyệt, tệp đã gửi tới đối tác"); render(); refreshApprovalCount();
      }
      if (t.dataset.rj) {
        const reason = prompt("Lý do từ chối (người gửi sẽ thấy):"); if (!reason) return;
        await api(`/api/approvals/${t.dataset.rj}/reject`, { method: "POST", body: { reason } }); toast("Đã từ chối"); render(); refreshApprovalCount();
      }
    } catch (err) { toast(err.message, true); }
  };
}

// ------------------------------------------------------------------ Tài khoản
async function loadUsers() { state.users = (await api("/api/admin/users")).users; return state.users; }
function userStatus(u) {
  if (u.status === "disabled") return `<span class="chip bad">Đã khóa</span>`;
  if (u.expires_at && u.expires_at < Date.now()) return `<span class="chip bad">Hết hạn</span>`;
  return `<span class="chip ok">Hoạt động</span>`;
}
async function renderUsers(m) {
  await loadUsers();
  const draw = () => {
    const q = state.q.toLowerCase();
    const list = state.users.filter((u) => (state.userKind === "all" || u.kind === state.userKind) &&
      (!q || [u.username, u.display_name, u.department, u.organization].join(" ").toLowerCase().includes(q)));
    $("#ut").innerHTML = list.length ? list.map((u) => `
      <tr>
        <td><b>${esc(u.username)}</b>${u.role === "admin" ? ` <span class="chip pri">Quản trị</span>` : ""}</td>
        <td>${esc(u.display_name)}${u.email ? `<div class="muted small">${esc(u.email)}</div>` : ""}</td>
        <td>${u.kind === "external" ? `<span class="chip ext">Bên ngoài</span> ${esc(u.organization)}` : esc(u.department)}</td>
        <td>${userStatus(u)}${u.must_change_password ? `<div class="muted small">Chưa đổi mật khẩu</div>` : ""}</td>
        <td class="small">${u.expires_at ? fmtDay(u.expires_at) : `<span class="muted">Không</span>`}
          ${u.kind === "external" && u.sponsor_name ? `<div class="muted">Phụ trách: ${esc(u.sponsor_name)}</div>` : ""}</td>
        <td class="small muted">${fmtDate(u.last_seen)}</td>
        <td style="white-space:nowrap">
          <button class="small" data-a="pw" data-id="${u.id}">Đặt lại mật khẩu</button>
          ${u.kind === "external" ? `<button class="small" data-a="exp" data-id="${u.id}">Gia hạn</button>` : ""}
          <button class="small ${u.status === "active" ? "danger" : ""}" data-a="st" data-id="${u.id}">${u.status === "active" ? "Khóa" : "Mở khóa"}</button>
        </td>
      </tr>`).join("") : `<tr><td colspan="7" class="empty">Không có tài khoản phù hợp</td></tr>`;
  };
  m.innerHTML = `
  <div class="bar">
    <select id="uk"><option value="all">Tất cả</option><option value="internal">Nhân viên</option><option value="external">Bên ngoài (NCC, khách hàng)</option></select>
    <input id="uq" placeholder="Tìm mã, tên, phòng ban, đơn vị" value="${esc(state.q)}">
    <span class="grow"></span>
    <button id="bulk">Nhập hàng loạt</button>
    <button class="primary" id="nu">+ Tạo tài khoản</button>
  </div>
  <div class="card"><table><thead><tr><th>Mã</th><th>Tên</th><th>Phòng ban / Đơn vị</th><th>Trạng thái</th><th>Hết hạn</th><th>Hoạt động gần nhất</th><th></th></tr></thead><tbody id="ut"></tbody></table></div>`;
  $("#uk").value = state.userKind;
  $("#uk").onchange = (e) => { state.userKind = e.target.value; draw(); };
  $("#uq").oninput = (e) => { state.q = e.target.value; draw(); };
  $("#nu").onclick = () => userDialog();
  $("#bulk").onclick = bulkDialog;
  $("#ut").onclick = async (e) => {
    const b = e.target.closest("button"); if (!b) return;
    const u = state.users.find((x) => x.id === b.dataset.id);
    if (b.dataset.a === "pw") {
      if (!confirm(`Đặt lại mật khẩu cho ${u.display_name}? Mọi thiết bị đang đăng nhập sẽ bị đăng xuất.`)) return;
      const pw = genPassword();
      await api(`/api/admin/users/${u.id}`, { method: "PATCH", body: { password: pw } });
      showSecret(`Mật khẩu mới của ${u.display_name}`, u.username, pw);
    }
    if (b.dataset.a === "st") {
      const to = u.status === "active" ? "disabled" : "active";
      if (to === "disabled" && !confirm(`Khóa ${u.display_name}? Mọi thiết bị sẽ bị đăng xuất và xóa dữ liệu chat.`)) return;
      await api(`/api/admin/users/${u.id}`, { method: "PATCH", body: { status: to } });
      toast(to === "disabled" ? "Đã khóa tài khoản" : "Đã mở khóa"); render();
    }
    if (b.dataset.a === "exp") {
      const v = prompt("Hạn sử dụng mới (YYYY-MM-DD), để trống = không hết hạn", u.expires_at ? new Date(u.expires_at).toISOString().slice(0, 10) : "");
      if (v === null) return;
      await api(`/api/admin/users/${u.id}`, { method: "PATCH", body: { expires_at: v.trim() } });
      toast("Đã cập nhật hạn sử dụng"); render();
    }
  };
  draw();
}
function openDialog(html, onSubmit) {
  const d = $("#dlg"), f = $("#dlgForm");
  f.innerHTML = html;
  f.onsubmit = async (e) => {
    if (e.submitter && e.submitter.value === "cancel") return;
    e.preventDefault();
    const btn = e.submitter; if (btn) btn.disabled = true;
    try { if ((await onSubmit(new FormData(f), f)) !== false) d.close(); }
    catch (err) { toast(err.message, true); }
    finally { if (btn) btn.disabled = false; }
  };
  d.showModal();
  return f;
}
function showSecret(title, username, pw) {
  openDialog(`<h2>${esc(title)}</h2>
    <div class="muted small">Chỉ hiển thị một lần. Gửi cho người dùng qua kênh an toàn (trực tiếp, email công ty). Họ sẽ được nhắc đổi mật khẩu khi đăng nhập.</div>
    <div class="secret">Mã đăng nhập: ${esc(username)}<br>Mật khẩu: ${esc(pw)}</div>
    <div class="actions"><button type="button" id="cp">Sao chép</button><button class="primary">Xong</button></div>`, () => {});
  $("#cp").onclick = () => navigator.clipboard?.writeText(`Mã đăng nhập: ${username}\nMật khẩu: ${pw}`).then(() => toast("Đã sao chép"));
}
function userDialog() {
  const pw = genPassword();
  const f = openDialog(`<h2>Tạo tài khoản</h2>

function bulkDialog() {
  openDialog(`<h2>Nhập nhân viên hàng loạt</h2>

    async (fd) => {
      const rows = String(fd.get("rows")).split(/\r?\n/).map((l) => l.split(/\t|,/).map((x) => x.trim())).filter((r) => r[0] && r[1]);
      if (!rows.length) throw new Error("Chưa có dòng hợp lệ");
      const out = [["ma", "ho_ten", "phong_ban", "mat_khau", "ket_qua"]];
      for (const [username, display_name, department = ""] of rows) {
        const password = genPassword();
        try { await api("/api/admin/users", { method: "POST", body: { username, display_name, department, password } }); out.push([username, display_name, department, password, "OK"]); }
        catch (e) { out.push([username, display_name, department, "", e.message]); }
      }
      const csv = "﻿" + out.map((r) => r.map((x) => `"${String(x).replace(/"/g, '""')}"`).join(",")).join("\n");
      const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([csv], { type: "text/csv" }));
      a.download = "tai-khoan-moi.csv"; a.click();
      toast(`Đã xử lý ${rows.length} dòng, xem kết quả trong tệp CSV`); render();
    });
}

      <button type="button" class="small danger" data-rm="${u.id}">Xóa</button></label>`).join("") || `<div class="empty">Trống</div>`;

  if (!append) {
    m.innerHTML = `<div class="bar">
      <select id="aa"><option value="">Mọi hành động</option>${Object.entries(ACT).map(([k, v]) => `<option value="${k}">${v}</option>`).join("")}</select>
      <select id="al"><option value="">Cả được phép và bị chặn</option><option value="0">Chỉ bị chặn</option><option value="1">Chỉ được phép</option></select>
      <span class="grow"></span><button id="arx">Nhật ký đã lưu trữ</button><button id="ar">Làm mới</button></div>
      <div class="card"><table><thead><tr><th>Thời gian</th><th>Người</th><th>Hành động</th><th>Kết quả</th><th>Chi tiết</th></tr></thead><tbody id="atb"></tbody></table></div>
      <div class="bar" style="justify-content:center;margin-top:12px"><button id="more">Xem thêm</button></div>`;
    state.audit = [];
    $("#aa").onchange = $("#al").onchange = $("#ar").onclick = () => renderAudit(m);
    $("#more").onclick = () => renderAudit(m, true);
    $("#arx").onclick = auditArchivesDialog;
  }
  const p = new URLSearchParams({ limit: "100" });
  if ($("#aa").value) p.set("action", $("#aa").value);
  if ($("#al").value) p.set("allowed", $("#al").value);
  if (append && state.audit.length) p.set("before_id", state.audit[state.audit.length - 1].id);
  const rows = (await api("/api/admin/audit?" + p)).audit;
  state.audit.push(...rows);
  $("#more").hidden = rows.length < 100;
  $("#atb").innerHTML = state.audit.map((a) => `<tr>
    <td class="small" style="white-space:nowrap">${fmtDate(a.at)}</td>
    <td>${esc(a.display_name || a.target || "")} <span class="muted small">${esc(a.username || "")}</span></td>
    <td>${esc(ACT[a.action] || a.action)}</td>
    <td>${a.allowed ? `<span class="chip ok">Được phép</span>` : `<span class="chip bad">Bị chặn</span>`}</td>
    <td class="small">${esc(a.detail)}</td></tr>`).join("") || `<tr><td colspan="5" class="empty">Chưa có dữ liệu</td></tr>`;
}

async function auditArchivesDialog() {
  const list = (await api("/api/admin/audit-archives")).archives.sort((a, b) => b.key.localeCompare(a.key));
  const f = openDialog(`<h2>Nhật ký đã lưu trữ</h2>
    <div class="muted small">Mỗi tệp là một lô nhật ký (định dạng JSON Lines, nén gzip). Mỗi lần tải về đều được ghi nhật ký.</div>
    <div class="picker">${list.map((a) => `<label><span style="flex:1">${esc(a.key.split("/").pop())} <span class="muted small">${fmtSize(a.size)}</span></span>
      <button type="button" class="small" data-k="${esc(a.key)}">Tải về</button></label>`).join("") || `<div class="empty">Chưa có</div>`}</div>
    <div class="actions"><button class="primary">Đóng</button></div>`, () => {});
  f.querySelector(".picker").onclick = async (e) => {
    const key = e.target.dataset?.k; if (!key) return; e.preventDefault();
    try {
      const r = await fetch(`${API}/api/admin/audit-archives/file?key=${encodeURIComponent(key)}`, { headers: { authorization: "Bearer " + TOKEN } });
      if (!r.ok) throw new Error("Không tải được");
      const a = document.createElement("a"); a.href = URL.createObjectURL(await r.blob()); a.download = key.split("/").pop(); a.click();
    } catch (err) { toast(err.message, true); }
  };
}

// ------------------------------------------------------------------ Khởi động
(async () => {
  if (!TOKEN) return renderLogin();
  try { const d = await api("/api/me"); if (d.me.role !== "admin") return logout("Tài khoản này không có quyền quản trị"); ME = d.me; shell(); }
  catch { /* api() đã chuyển về màn hình đăng nhập */ }
})();
</script>
