name = "chat-noibo"
main = "src/index.ts"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]

# Cơ sở dữ liệu tin nhắn, người dùng, nhóm, nhật ký kiểm soát.
# Tạo bằng: npx wrangler d1 create chat_noibo --location=apac  rồi dán database_id vào đây.
[[d1_databases]]
binding = "DB"
database_name = "chat_noibo"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

# Nhật ký kiểm soát, DB riêng. Tạo bằng: npx wrangler d1 create chat_noibo_audit --location=apac
[[d1_databases]]
binding = "AUDIT"
database_name = "chat_noibo_audit"
database_id = "00000000-0000-0000-0000-000000000001"
migrations_dir = "migrations-audit"

# Kho tệp đính kèm. Tạo bằng: npx wrangler r2 bucket create chat-noibo-files
[[r2_buckets]]
binding = "FILES"
bucket_name = "chat-noibo-files"

# Mỗi người dùng có một "hub" giữ các kết nối WebSocket của mọi thiết bị của họ.
[[durable_objects.bindings]]
name = "HUB"
class_name = "UserHub"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["UserHub"]

# Hàng đợi gửi thông báo đẩy (cần gói Workers Paid). Tạo bằng: npx wrangler queues create chat-noibo-push
[[queues.producers]]
binding = "PUSH_QUEUE"
queue = "chat-noibo-push"

[[queues.consumers]]
queue = "chat-noibo-push"
max_batch_size = 10
max_batch_timeout = 1
max_retries = 3

# Mỗi 15 phút: thu hồi phiên của tài khoản (thường là tài khoản bên ngoài) đã hết hạn.
[triggers]
crons = ["*/15 * * * *", "17 19 * * *"]   # 19:17 UTC = 02:17 giờ VN: lưu trữ tin/nhật ký cũ

# Trang quản trị tĩnh: https://<tên-miền>/admin/
[assets]
directory = "./public"
not_found_handling = "none"

[vars]
# Origin được phép gọi API từ trình duyệt (chỉ dùng cho bản web thử nghiệm). Ứng dụng native không cần CORS.
CORS_ORIGIN = "*"
# Giới hạn kích thước một tệp tải lên (byte).
MAX_UPLOAD_BYTES = "52428800"

# Bí mật — đặt bằng: npx wrangler secret put ADMIN_BOOTSTRAP_TOKEN
# ADMIN_BOOTSTRAP_TOKEN dùng một lần để tạo tài khoản quản trị đầu tiên.
